*{box-sizing:border-box;margin:0;padding:0}

#app{max-width:430px;height:100%;height:100dvh;margin:0 auto;display:flex;flex-direction:column;padding:8px 10px}

#cr{color:#e0b04a;font-weight:bold}
main{flex:1;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;padding-top:8px;min-height:0}
.scr{display:none;height:100%;flex-direction:column;gap:8px}
.scr.on{display:flex}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 3px),linear-gradient(#1a1916,#0e0e0c);border:1px solid #3a3730;border-radius:6px;display:block;margin:0 auto}
button{font:inherit;color:#d8d2c0;background:#1b1c19;border:1px solid #4a463c;border-radius:6px;padding:10px;cursor:pointer}
button:active{background:#2c2a24}
button.pri{background:#5a3a1c;border-color:#b07a32;font-weight:bold}
button.warn{background:#4a1a16;border-color:#8a3028}
button:disabled{opacity:.4}
.row{display:flex;gap:6px}.row>*{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:3px 8px;font-size:13px;background:#131411;border:1px solid #3a3730;border-radius:6px;padding:6px 8px}
.stats b{color:#c9b98a;float:right}
.role{text-align:center;font-weight:bold;color:#d9a441;font-size:16px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.slots button{text-align:left;padding:7px 8px;font-size:13px;line-height:1.3}
.slots small{color:#7d7868;display:block;font-size:11px}
.panel{position:absolute;inset:0;background:#0a0a09f2;display:none;flex-direction:column;gap:6px;padding-top:8px}
.panel.on{display:flex}
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px}
.list button{text-align:left;font-size:13px;padding:8px}
.list .eq{border-color:#e0b04a}
.up{color:#b5c46a}.dn{color:#d0503a}
.log{flex:1;overflow-y:auto;background:#080908;border:1px solid #3a3730;border-radius:6px;padding:8px;font-size:13px;line-height:1.5;font-family:ui-monospace,monospace}
.warnTxt{color:#d0503a;font-size:12px;text-align:center;min-height:16px}
.vs{display:flex;justify-content:space-around;align-items:center}
.vs div{text-align:center;font-size:12px}
#rankList .rw{display:flex;align-items:center;gap:6px;font-size:12px;background:#131411;border:1px solid #2a2823;padding:3px 6px;min-height:30px}
#rankList .rw.me{border-color:#e0b04a;color:#e0b04a}#rankList .rw .nm{flex:1}#rankList .rw button{padding:4px 8px;font-size:12px}
#rankList .rk{width:2.6em;color:#d9a441}.tag{font-size:10px;color:#d0503a;border:1px solid #6a2a20;padding:0 3px;margin-left:3px}
.vcard{display:flex;gap:8px;align-items:center;text-align:left;padding:6px}.vcard canvas{width:90px;height:75px;flex:none}.vcard div{font-size:12px;line-height:1.5}.vcard b{font-size:14px}
#arena{width:100%;max-width:360px;height:auto;aspect-ratio:6/5}
#s-battle .vs{align-items:flex-start}
#btnExit{flex:none;padding:6px 10px;font-size:12px;align-self:center}
#resOv{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;background:#0b0c0bf4;border-top:2px solid #b07a32;padding:10px 12px calc(10px + env(safe-area-inset-bottom));max-width:430px;margin:0 auto}
#resOv.on{display:block}#resOv .rt{font-weight:bold;margin-bottom:8px;line-height:1.5;font-size:14px}
@media (max-height:760px){#s-battle #binfo{display:none}#s-battle .log{height:74px}}
.intro{border:1px solid #5a2a22;background:#1a1210;padding:6px 8px;margin:4px 0;font-size:12px;color:#c9b98a}.intro .q{color:#e8dcc0;font-size:13px}.cs{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:4px;border:1px solid #000}
.tacrow{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid #2a2823;background:#131411;padding:4px 8px;font-size:13px;margin:4px 0}.tacrow button{flex:none;padding:5px 10px;font-size:12px}#tacSel{display:none}#tacSel.on{display:block}#tacSel .row button{padding:7px 2px;font-size:12px}

.psrow{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:4px 0}.psrow button{display:flex;flex-direction:column;align-items:center;padding:3px 2px;font-size:10px;gap:1px;min-width:0}.psrow button span{max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.pschk{font-size:12px;color:#a39c88;display:flex;align-items:center;gap:4px;margin:2px 0}
.shi{display:flex;align-items:center;gap:6px;text-align:left;padding:6px 8px;font-size:12px}.shi .sl{flex:none;width:1.6em;color:#d9a441;border:1px solid #4a463c;text-align:center}.shi .sn{flex:1;min-width:0}.shi .sn small{display:block;color:#7d7868;font-size:10px}.shi .sp{flex:none;color:#e0b04a}.shi.own{opacity:.55}.shi.own .sp{color:#7d7868}
.shdet{border:1px solid #6a5a30;background:#16140e;padding:6px 8px;font-size:12px;position:sticky;top:0;z-index:2}

.pr{display:flex;align-items:center;gap:3px;background:#131411;border:1px solid #2a2823;padding:3px}.pr .no{width:1.3em;color:#d9a441;text-align:center;font-size:12px}
.pr select{flex:1;min-width:0;font:inherit;font-size:12px;background:#1b1c19;color:#d8d2c0;border:1px solid #4a463c;border-radius:3px;padding:6px 2px}
.pr .th{color:#7d7868;font-size:12px}.pr .pc{flex:1;font-size:12px;color:#a39c88;padding-left:4px}.pr button{padding:5px 7px;font-size:12px;flex:none}
footer{border-top:1px solid #3a3730;padding-top:5px;font-size:11px;color:#6a6558;text-align:center}
.inv{font-size:12px;color:#a39c88;background:#131411;border:1px solid #3a3730;border-radius:6px;padding:6px 8px;line-height:1.5}
.hpbar{height:8px;background:#2a1a1a;border-radius:4px;overflow:hidden;width:120px;margin:3px auto}
.hpbar i{display:block;height:100%;background:#a8943a}

header h1 small{font-size:10px;color:#6a6558;letter-spacing:2px;margin-left:4px}

.bars .b{height:7px;background:#24221d}.bars .b i{display:block;height:100%;background:#8a4b2a}.bars .b i.hi{background:#c0392b}

.cmp .h{color:#7d7868}

<div id="app">
<header><h1>▣ 鉄屑戦線 <small>TETSUKUZU FRONT</small></h1><span id="cr">0 cr</span></header>
<main>
 <!-- Home / Garage -->
 <section class="scr on" id="s-home">
  <canvas id="cvHome" width="64" height="64" style="width:192px;height:192px"></canvas>
  <div class="role" id="roleHome"></div>
  <div class="stats" id="statHome"></div>
  <div class="hd">■ リーグ戦況</div>
  <div class="inv" id="brief"></div>
  <div class="tacrow"><span>行動方針：<b id="tacHome"></b></span><button id="btnTacHome" onclick="$('tacSel').classList.toggle('on')">変更 ▾</button></div>
  <div id="tacSel"><div class="row" id="tacH1"></div><div class="row" id="tacH2"></div></div>
  <div class="psrow" id="psHome"></div>
  <div class="warnTxt" id="psMsgH"></div>
  <div class="row"><button class="pri" onclick="go('rank')">▶ リーグ戦</button><button class="pri" onclick="go('venue')">▶ 会場移動</button></div>
  <div class="row"><button onclick="go('asm')">▶ 機体組立</button><button onclick="go('sortie')">▶ フリー出撃</button></div>
  <div class="row"><button onclick="go('shop')">▶ 闇市（品書き）</button><button class="warn" onclick="resetAll()">データ初期化</button></div>
  <div class="warnTxt" id="homeMsg"></div>
  <div class="hd">■ 前回 戦闘報告</div>
  <div class="inv" id="report"></div>
  <div class="inv" id="invInfo" style="font-size:11px"></div>
 </section>
 <!-- Shop -->
 <section class="scr" id="s-shop">
  <div class="role">闇市　品書き</div>
  <div class="inv" id="shopInfo"></div>
  <div id="shopDet" class="shdet" style="display:none"></div>
  <div class="warnTxt" id="shopMsg"></div>
  <div class="list" id="shopList" style="gap:3px;flex:none"></div>
  <button onclick="go('home')">← 格納庫へ戻る</button>
 </section>
 <!-- Assemble -->
 <section class="scr" id="s-asm">
  <canvas id="cvAsm" width="64" height="64" style="width:128px;height:128px"></canvas>
  <div class="role" id="roleAsm"></div>
  <div class="stats" id="statAsm"></div>
  <div class="warnTxt" id="owAsm"></div>
  <div class="slots" id="slots"></div>
  <div class="hd">■ 機体性能</div>
  <div class="bars" id="bars"></div>
  <div class="hd">■ 機体プリセット</div>
  <label class="pschk"><input type="checkbox" id="psTac" checked> 行動方針も一緒に保存</label>
  <div class="pslist" id="psAsm"></div>
  <div class="warnTxt" id="psMsg"></div>
  <button onclick="go('home')">← 格納庫へ戻る</button>
  <div class="panel" id="pick">
   <div class="role" id="pickTitle"></div>
   <div class="list" id="pickList"></div>
   <button onclick="closePick()">閉じる</button>
  </div>
 </section>
 <!-- Sortie -->
 <section class="scr" id="s-sortie">
  <div class="role" id="sortieTitle">出撃準備 ── 敵影捕捉</div>
  <div class="vs">
   <div><canvas id="cvMe" width="64" height="64" style="width:128px;height:128px"></canvas>自機<br><span id="meRole"></span></div>
   <div><canvas id="cvEn" width="64" height="64" style="width:128px;height:128px;transform:scaleX(-1)"></canvas><span id="enName"></span><br><span id="enRole"></span></div>
  </div>
  <div id="enIntro" class="intro" style="display:none"></div>
  <div class="hd">■ 敵機 諜報データ</div>
  <div class="stats" id="statEn"></div>
  <div class="hd">■ 戦力比較（自機／敵機）</div>
  <div class="cmp" id="cmp"></div>
  <div class="warnTxt" id="sortieMsg"></div>
  <div class="hd">■ 行動方針（AI）</div>
  <div class="row" id="tacs"></div>
  <div class="row" id="tacs2"></div>
  <div class="flav" id="tacDesc" style="font-style:normal"></div>
  <button class="pri" id="btnFight" onclick="fight()">▶ 交戦開始</button>
  <div class="row"><button id="btnReroll" onclick="newEnemy()">索敵やり直し</button><button onclick="go('home')">撤収</button></div>
 </section>
 <!-- Venue select -->
 <section class="scr" id="s-venue">
  <div class="role">会場移動</div>
  <div class="list" id="venueList"></div>
  <button onclick="go('home')">← 格納庫へ戻る</button>
 </section>
 <!-- League ranking -->
 <section class="scr" id="s-rank">
  <div class="role" id="rankTitle">鉄屑リーグ 順位表</div>
  <div class="flav" id="rankInfo" style="font-style:normal;text-align:center"></div>
  <div class="list" id="rankList" style="gap:2px"></div>
  <button onclick="go('home')">← 格納庫へ戻る</button>
 </section>
 <!-- Program editor -->
 <section class="scr" id="s-prog">
  <div class="role">行動プログラム編集</div>
  <div class="row" id="pslots"></div>
  <div class="flav" style="font-style:normal">上から順に判定し、最初に当てはまった行動を実行（最大8行）</div>
  <div class="list" id="prules" style="gap:4px;flex:none"></div>
  <div class="row"><button id="btnAddRule" onclick="addRule()">＋ ルール追加</button></div>
  <div class="hd">■ プリセットを読み込む</div>
  <div class="row"><button onclick="loadPreset('rush')">突撃</button><button onclick="loadPreset('kite')">引き撃ち</button><button onclick="loadPreset('cover')">遮蔽物</button><button onclick="loadPreset('evade')">回避</button></div>
  <button class="pri" id="btnUseProg" onclick="useProg()">▶ このプログラムで出撃準備へ</button>
 </section>
 <!-- Battle -->
 <section class="scr" id="s-battle">
  <div class="vs">
   <div>自機<div class="hpbar"><i id="hpMe"></i></div><span id="hpMeT"></span></div>
   <button id="btnExit" onclick="exitBattle()">退出</button>
   <div><span id="bEn"></span><div class="hpbar"><i id="hpEn"></i></div><span id="hpEnT"></span></div>
  </div>
  <canvas id="arena" width="360" height="300" style="width:360px;height:300px"></canvas>
  <div class="log" id="log"></div>
  <div class="cmp" id="binfo"></div>
  <div class="row"><button id="btnSpd" onclick="toggleSpd()">2倍速</button><button id="btnSkip" onclick="skipBattle()">結果へスキップ</button></div>
  <button class="pri" id="btnBack" onclick="go('home')" disabled>格納庫へ帰投</button>
  <div id="resOv"><div class="rt" id="resTxt"></div><div class="row"><button class="pri" id="btnOvHome" onclick="go('home')">格納庫へ帰投</button><button id="btnOvRank" onclick="go('rank')">順位表へ</button></div></div>
 </section>
</main>
<footer>制作：清掃員工房 ／ カナタゲームズ　v0.8.4</footer>
</div>

function calc(b){
 const t={wt:0,arm:0,atk:0,mob:0,fly:0,cap:0,hit:0},ids=Object.values(b).filter(Boolean);
 ids.forEach(id=>{const p=P[id];for(const k in t)t[k]+=p[k]||0;});
 const cap=t.cap, legs=b.LEGS, prop=ids.some(id=>P[id].prop);
 const turret=!legs&&!prop;
 let mob=t.mob, over=turret?0:Math.max(0,t.wt-cap); // 砲台型は据え置きなので積載制限なし
 if(over>0) mob-=over*2;                    // 過積載ペナルティ
 if(!legs && !(prop||t.fly>=30)) mob=Math.min(mob,5)-10; // 脚なし地上＝ほぼ動けない
 let fly=t.fly; if(prop&&!legs) fly+=15;     // 脚なし＋回転翼＝ヘリ
 if(over>0) fly=Math.max(0,fly-over*3);
 const canFly=fly>=30;
 const hp=60+Math.round(t.arm*HPK);
 let role='汎用型';
 if(!legs&&prop&&canFly) role='ヘリ型';
 else if(canFly) role='飛行型';
 else if(!legs&&prop) role='飛行不能ヘリ（過積載）';
 else if(!legs) role='固定砲台型';
 else if(t.arm>=55) role='重装型';
 else if(t.atk>=45) role='強襲型';
 else if(mob>=45) role='高機動型';
 if(legs==='L2'&&role==='汎用型') role='戦車型';
 return{...t,mob,fly,over,cap,hp,canFly,role,tooHeavy:over>cap*0.3};
}

 ['LEGS','BODY','ARMS','HEAD'].forEach(k=>{if(b[k])put(pimg(b[k],f),false,b[k]);});
 [['SHOULDER','R'],['BACK','L']].forEach(([k,side])=>{const id=b[k];if(id&&(AKIND[id]==='L'||AKIND[id]==='R'))put(pimg(id,f),AKIND[id]!==side,id);});

 const t=RCT.getContext('2d');t.clearRect(0,0,64,64);t.drawImage(cv,0,0);ctx.save();

 ctx.globalCompositeOperation='destination-in';ctx.drawImage(RCT,0,0);ctx.restore();}

 if(col){draw(cv,b,f,arena);recolor(cv,col);if(!arena){const c=cv.getContext('2d');c.fillStyle='#ffffff10';c.fillRect(4,60,56,3);}return;}
 if(cv.width!==64){cv.width=64;cv.height=64;}

 if(!arena){ctx.fillStyle='#ffffff10';ctx.fillRect(4,60,56,3);}

}

 if(BASIC.includes(id))return null;
